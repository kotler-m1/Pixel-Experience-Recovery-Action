name: Pixel Experience Recovery Builder

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'Pixel Experience Manifest Branch'
        required: true
        default: 'fourteen'
        type: choice
        options:
          - fourteen
          - thirteen
          - twelve
      DEVICE_TREE:
        description: 'Custom Recovery Tree' 
        required: true
        default: 'https://github.com/kotler-m1/android_device_lava_LXX521-recovery.git'
      DEVICE_TREE_BRANCH:
        description: 'Custom Recovery Tree Branch' 
        required: true
        default: 'PE-14'
      DEVICE_PATH:
        description: 'Specify your Device Path' 
        required: true
        default: 'device/lava/lxx521'
      DEVICE_NAME:
        description: 'Specify your Device Codename' 
        required: true
        default: 'lxx521'
      BUILD_TARGET:
        description: 'Specify your Build Target' 
        required: true
        default: 'vendorboot'
        type: choice
        options:
          - boot
          - recovery
          - vendorboot

jobs:
  build:
    name: Build PE Recovery by ${{ github.actor }}
    runs-on: ubuntu-22.04
    if: github.event.repository.owner.id == github.event.sender.id
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - name: Check Out
        uses: actions/checkout@v3

      - name: Display Inputs
        run: |
          echo "::group::User Environment Variables"
          echo "Displaying variables/inputs."
          echo "Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
          echo "Device Tree: ${{ github.event.inputs.DEVICE_TREE }}"
          echo "Device Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
          echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
          echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
          echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}image"
          echo "::endgroup::"

      - name: Cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Set Swap Space
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 24

      - name: Prepare the environment
        run: |
          sudo apt update
          sudo apt -y upgrade
          sudo apt -y install gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib lib32ncurses5-dev x11proto-core-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libwxgtk3.0-gtk3-dev lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev libtinfo5 libgflags-dev zstd
          sudo add-apt-repository universe
          sudo apt -y install libncurses5

      - name: Install OpenJDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 8

      - name: Install Git-Repo
        run: |
          mkdir ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize Repo
        run: |
          mkdir workspace
          cd workspace
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          repo init --depth=1 -u https://github.com/PixelExperience/manifest -b ${{ github.event.inputs.MANIFEST_BRANCH }}

      - name: Remove Unreachable Repos
        run: |
          cd workspace
          mkdir -p .repo/local_manifests
          cat << 'EOF' > .repo/local_manifests/remove.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remove-project name="android_external_faceunlock" />
            <remove-project name="android_vendor_gms" />
            <remove-project name="external/faceunlock" />
            <remove-project name="vendor/gms" />
          </manifest>
          EOF

      - name: Repo Sync
        run: |
          cd workspace
          repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Device Tree
        run: |
          cd workspace
          git clone ${{ github.event.inputs.DEVICE_TREE }} -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} ./${{ github.event.inputs.DEVICE_PATH }}
          cd ${{ github.event.inputs.DEVICE_PATH }}
          echo "COMMIT_ID=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Check Build Makefile
        run: |
          cd workspace
          if [ -f ${{ github.event.inputs.DEVICE_PATH }}/pe_${{ github.event.inputs.DEVICE_NAME }}.mk ]; then
              echo "DEVICE_MAKEFILE=pe_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
          elif [ -f ${{ github.event.inputs.DEVICE_PATH }}/aosp_${{ github.event.inputs.DEVICE_NAME }}.mk ]; then
              echo "DEVICE_MAKEFILE=aosp_${{ github.event.inputs.DEVICE_NAME }}" >> $GITHUB_ENV
          else
              echo "No PE makefile found!"
          fi
        continue-on-error: true

      - name: Building Image 
        run: |
          cd workspace
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch ${{ env.DEVICE_MAKEFILE }}-userdebug || lunch ${{ env.DEVICE_MAKEFILE }}-eng
          make clean
          make ${{ github.event.inputs.BUILD_TARGET }}image -j$(nproc --all)
          echo "Done building your ${{ github.event.inputs.BUILD_TARGET }}.img"

      - name: Set Build Date
        run: |
          echo "BUILD_DATE=$(date +%Y%m%d)" >> $GITHUB_ENV
          DEVICE_TREE_URL="${{ github.event.inputs.DEVICE_TREE }}"
          if [[ "${DEVICE_TREE_URL}" == *.git ]]; then
            DEVICE_TREE_URL="${DEVICE_TREE_URL%.git}"
          fi
          echo "DEVICE_TREE_URL=${DEVICE_TREE_URL}" >> $GITHUB_ENV

      - name: Check if Recovery Exist
        run: |
          cd workspace
          OUT_DIR="out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
          if [ -f $OUT_DIR/vendor_boot.img ]; then
              echo "RECOVERY_TYPE=vendor_boot" >> $GITHUB_ENV
              echo "vendor_boot.img file found!"
              echo "MD5_IMG=$(md5sum $OUT_DIR/vendor_boot.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
          elif [ -f $OUT_DIR/recovery.img ]; then
              echo "RECOVERY_TYPE=recovery" >> $GITHUB_ENV
              echo "recovery.img file found!"
              echo "MD5_IMG=$(md5sum $OUT_DIR/recovery.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
          elif [ -f $OUT_DIR/boot.img ]; then
              echo "RECOVERY_TYPE=boot" >> $GITHUB_ENV
              echo "boot.img file found!"
              echo "MD5_IMG=$(md5sum $OUT_DIR/boot.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
          else
              echo "No Recovery image file found!"
              exit 1
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            workspace/out/target/product/${{ github.event.inputs.DEVICE_NAME }}/${{ env.RECOVERY_TYPE }}.img
          name: Pixel Experience Recovery for ${{ github.event.inputs.DEVICE_NAME }} // ${{ env.BUILD_DATE }}
          tag_name: ${{ github.run_id }}
          body: |
            Manifest Branch: ${{ github.event.inputs.MANIFEST_BRANCH }}
            Target Image: ${{ github.event.inputs.BUILD_TARGET }}image
            Device Tree: [Device Tree](${{ env.DEVICE_TREE_URL }}/tree/${{ github.event.inputs.DEVICE_TREE_BRANCH }})
            Commit: [${{ env.COMMIT_ID }}](${{ env.DEVICE_TREE_URL }}/commit/${{ env.COMMIT_ID }})
            MD5: ${{ env.MD5_IMG }}
